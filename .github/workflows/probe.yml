name: relay-test
on:
  push:
    branches: [ arena/9573e9c7-make-the-best-game ]
permissions:
  contents: write
jobs:
  test:
    if: contains(github.event.head_commit.message, 'relay: test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9573e9c7-make-the-best-game
      - name: Write marker
        run: |
          mkdir -p .work
          printf '{"ok":true,"time":"%s"}\n' "$(date -u +%FT%TZ)" > .work/relay-marker.json
          git config user.name "relay[bot]"
          git config user.email "relay[bot]@users.noreply.github.com"
          git add .work/relay-marker.json
          git commit -m "relay: marker"
          git push origin HEAD:arena/9573e9c7-make-the-best-game
