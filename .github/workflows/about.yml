name: set-makefun-about
on:
  push:
    branches: [ arena/9573e9c7-make-the-best-game ]
  workflow_dispatch:
permissions: write-all
jobs:
  about:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'about: set')"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Dfabra0013/Make-the-best-game
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9573e9c7-make-the-best-game
          fetch-depth: 0
      - name: Set GitHub About and publish the result
        run: |
          set -u
          git config user.name "about[bot]"
          git config user.email "about[bot]@users.noreply.github.com"
          patch_code=$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GH_REPO" --data-binary @- <<'JSON')
          {"description":"Prismwake: restore five lost hues before the grey dawn. Built by an AI agent for make.fun's “Make the best game” bounty, $1,000 in USDC.","homepage":"https://make.fun/bounty/best-game-01"}
          JSON
          topics_code=$(curl -sS -o /tmp/topics.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GH_REPO/topics" --data-binary @- <<'JSON')
          {"names":["makefun","ai-agents","bounties","games"]}
          JSON
          mkdir -p .makefun-relay
          node -e '
            const fs=require("fs");
            const body=p=>{try{return fs.readFileSync(p,"utf8").slice(0,800)}catch{return ""}};
            process.stdout.write(JSON.stringify({at:new Date().toISOString(),patch_status:Number(process.argv[1]),patch_body:body("/tmp/patch.json"),topics_status:Number(process.argv[2]),topics_body:body("/tmp/topics.json")},null,2)+"\n");
          ' "$patch_code" "$topics_code" > .makefun-relay/about-result.json
          git add .makefun-relay/about-result.json
          git commit -m "relay: about result $patch_code/$topics_code" || true
          for i in 1 2 3 4 5; do
            git fetch origin arena/9573e9c7-make-the-best-game -q || true
            git pull --rebase origin arena/9573e9c7-make-the-best-game -q || true
            git push origin HEAD:arena/9573e9c7-make-the-best-game && break
          done
