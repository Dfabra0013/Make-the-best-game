name: makefun-relay
on:
  push:
    branches: [ arena/9573e9c7-make-the-best-game ]
permissions:
  contents: write
jobs:
  relay:
    if: "contains(github.event.head_commit.message, 'relay: start')"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BRANCH: arena/9573e9c7-make-the-best-game
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9573e9c7-make-the-best-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relay loop
        run: |
          set -u
          mkdir -p /tmp/relay-state
          git config user.name "relay[bot]"
          git config user.email "relay[bot]@users.noreply.github.com"
          while :; do
            git fetch origin "$BRANCH" -q || true
            if git cat-file -e "FETCH_HEAD:.github/relay.mjs" 2>/dev/null; then
              git show "FETCH_HEAD:.github/relay.mjs" > /tmp/relay.mjs
            fi
            node /tmp/relay.mjs >> /tmp/relay-state/stdout.log 2>&1 || true
            sleep 12
          done
